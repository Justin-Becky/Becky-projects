<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6dbe9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Becky's Mail">
  <title>Becky's Mailbox</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Decorative sky -->
  <div class="sky" aria-hidden="true">
    <div class="cloud cloud--1"></div>
    <div class="cloud cloud--2"></div>
    <div class="cloud cloud--3"></div>
    <div class="floaties" id="floaties"></div>
  </div>

  <main class="scene">
    <header class="title">
      <h1 id="title">Becky's Mailbox</h1>
      <p id="subtitle">&nbsp;</p>
    </header>

    <div class="mailbox-wrap">
      <button class="mailbox" id="mailbox" type="button" aria-label="Mailbox">
        <svg class="mailbox-svg" viewBox="0 0 240 410" aria-hidden="true">
          <defs>
            <linearGradient id="gBody" x1="0" x2="1">
              <stop offset="0" stop-color="#a51f2a"/>
              <stop offset=".28" stop-color="#d93a44"/>
              <stop offset=".42" stop-color="#ef6c72"/>
              <stop offset=".58" stop-color="#d63a44"/>
              <stop offset="1" stop-color="#8f1822"/>
            </linearGradient>
            <linearGradient id="gDark" x1="0" x2="1">
              <stop offset="0" stop-color="#7a141d"/>
              <stop offset=".4" stop-color="#bd2f39"/>
              <stop offset="1" stop-color="#6a1018"/>
            </linearGradient>
            <radialGradient id="gDome" cx=".38" cy=".3" r=".85">
              <stop offset="0" stop-color="#f58a8f"/>
              <stop offset=".45" stop-color="#d63a44"/>
              <stop offset="1" stop-color="#8f1822"/>
            </radialGradient>
            <linearGradient id="gInside" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2a080c"/>
              <stop offset="1" stop-color="#4f1219"/>
            </linearGradient>
            <clipPath id="cSlot"><rect x="60" y="70" width="120" height="67"/></clipPath>
            <clipPath id="cInside"><rect x="70" y="186" width="100" height="126" rx="8"/></clipPath>
          </defs>

          <!-- shadow -->
          <ellipse cx="120" cy="398" rx="92" ry="9" fill="rgba(120,70,110,.2)"/>

          <!-- plinth -->
          <rect x="36" y="340" width="168" height="16" rx="5" fill="url(#gDark)"/>
          <rect x="42" y="354" width="156" height="38" rx="6" fill="url(#gDark)"/>
          <rect x="42" y="354" width="156" height="4" fill="#5a0d14" opacity=".5"/>

          <!-- body -->
          <rect x="48" y="108" width="144" height="236" fill="url(#gBody)"/>

          <!-- crown -->
          <path d="M46 98 C 46 34, 194 34, 194 98 Z" fill="url(#gDome)"/>
          <path d="M62 82 C 76 62, 164 62, 178 82" stroke="#f9a4a9" stroke-width="3" fill="none" stroke-linecap="round" opacity=".45"/>
          <ellipse cx="120" cy="51" rx="17" ry="5" fill="url(#gDark)"/>
          <circle cx="120" cy="41" r="9" fill="url(#gDome)"/>
          <circle cx="117" cy="38" r="2.5" fill="#fff" opacity=".45"/>
          <rect x="38" y="94" width="164" height="20" rx="7" fill="url(#gDark)"/>
          <g fill="#f2b8a0" opacity=".85">
            <circle cx="60" cy="104" r="2"/><circle cx="90" cy="104" r="2"/><circle cx="120" cy="104" r="2"/>
            <circle cx="150" cy="104" r="2"/><circle cx="180" cy="104" r="2"/>
          </g>

          <!-- slot with a letter peeking out -->
          <rect x="74" y="128" width="92" height="18" rx="9" fill="#7a141d"/>
          <rect x="78" y="132" width="84" height="10" rx="5" fill="#1e0507"/>
          <g id="slotLetter" clip-path="url(#cSlot)">
            <g class="slot-letter-inner">
              <rect x="97" y="114" width="46" height="32" rx="2" fill="#fff4f7" stroke="#f0a3b8" stroke-width="1.5"/>
              <path d="M97 115 L120 129 L143 115" fill="none" stroke="#f0a3b8" stroke-width="1.5"/>
              <circle cx="120" cy="129" r="3" fill="#ee94ae"/>
            </g>
          </g>
          <rect x="76" y="146" width="88" height="2.5" rx="1.25" fill="#f58a8f" opacity=".55"/>

          <!-- plate -->
          <rect x="84" y="156" width="72" height="19" rx="3" fill="#fbead6" stroke="#d9b48f"/>
          <text x="120" y="169.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9.5" letter-spacing="2.2" fill="#9b1d27" font-weight="700">LETTERS</text>

          <!-- inside of the box, seen through the window or when the door opens -->
          <g id="inside">
            <rect id="doorArea" x="70" y="186" width="100" height="126" rx="8" fill="url(#gInside)"/>
            <g clip-path="url(#cInside)">
              <g id="web" stroke="#ffffff" stroke-opacity=".28" stroke-width=".7" fill="none">
                <path d="M84 202 L112 207 M84 202 L106 222 M84 202 L95 232 M84 202 L84 238"/>
                <path d="M93 204 Q95 210 90 213 Q87 212 84 212"/>
                <path d="M101 205 Q102 214 97 218 Q90 222 84 221"/>
                <path d="M109 207 Q109 219 102 224 Q92 230 84 230"/>
              </g>
              <g id="stack"></g>
            </g>
          </g>

          <!-- door with a glass window -->
          <g id="door">
            <path fill="url(#gBody)" fill-rule="evenodd" stroke="#8f1822" stroke-width="2"
              d="M78 186 H162 Q170 186 170 194 V304 Q170 312 162 312 H78 Q70 312 70 304 V194 Q70 186 78 186 Z
                 M90 202 H150 Q156 202 156 208 V250 Q156 256 150 256 H90 Q84 256 84 250 V208 Q84 202 90 202 Z"/>
            <path fill="none" stroke="#8f1822" stroke-width="4"
              d="M90 202 H150 Q156 202 156 208 V250 Q156 256 150 256 H90 Q84 256 84 250 V208 Q84 202 90 202 Z"/>
            <path d="M92 205 L108 205 L94 253 L87 253 Z" fill="#fff" opacity=".13"/>
            <path d="M114 205 L119 205 L105 253 L100 253 Z" fill="#fff" opacity=".1"/>
            <text x="120" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#fbead6" opacity=".95">B &#9825;</text>
            <circle cx="158" cy="272" r="4" fill="#4a0d13"/>
            <rect x="157" y="273" width="2" height="7" rx="1" fill="#4a0d13"/>
            <g fill="#f2b8a0" opacity=".8">
              <circle cx="77" cy="193" r="1.6"/><circle cx="163" cy="193" r="1.6"/>
              <circle cx="77" cy="305" r="1.6"/><circle cx="163" cy="305" r="1.6"/>
            </g>
          </g>

          <!-- vertical body highlights -->
          <rect x="74" y="120" width="5" height="220" fill="#fff" opacity=".08"/>
        </svg>
      </button>

      <div class="badge" id="badge" hidden aria-hidden="true">
        <svg viewBox="0 -2 32 32"><path d="M16 29 C 6 21, 0 15, 0 8.5 A 8 8 0 0 1 16 5 A 8 8 0 0 1 32 8.5 C 32 15, 26 21, 16 29 Z" fill="#ee94ae"/></svg>
        <span id="badgeCount">1</span>
      </div>

      <svg class="ground" viewBox="0 0 400 80" aria-hidden="true">
        <ellipse cx="200" cy="46" rx="196" ry="30" fill="#cdeedf"/>
        <ellipse cx="200" cy="40" rx="170" ry="20" fill="#dcf5ea"/>
        <g stroke="#9fd9c0" stroke-width="2" stroke-linecap="round" fill="none">
          <path d="M40 46 q3 -10 1 -16 M44 46 q2 -8 6 -12"/>
          <path d="M352 50 q-2 -10 -6 -14 M356 50 q1 -9 4 -13"/>
          <path d="M150 62 q2 -7 0 -11 M260 62 q-2 -7 1 -11"/>
        </g>
        <g>
          <g transform="translate(70 34)"><circle r="4" cx="0" cy="-5" fill="#f8c3d2"/><circle r="4" cx="5" cy="0" fill="#f8c3d2"/><circle r="4" cx="0" cy="5" fill="#f8c3d2"/><circle r="4" cx="-5" cy="0" fill="#f8c3d2"/><circle r="2.6" fill="#fff0b8"/></g>
          <g transform="translate(330 38)"><circle r="4" cx="0" cy="-5" fill="#d9cdf5"/><circle r="4" cx="5" cy="0" fill="#d9cdf5"/><circle r="4" cx="0" cy="5" fill="#d9cdf5"/><circle r="4" cx="-5" cy="0" fill="#d9cdf5"/><circle r="2.6" fill="#fff0b8"/></g>
          <g transform="translate(108 56) scale(.8)"><circle r="4" cx="0" cy="-5" fill="#fff0b8"/><circle r="4" cx="5" cy="0" fill="#fff0b8"/><circle r="4" cx="0" cy="5" fill="#fff0b8"/><circle r="4" cx="-5" cy="0" fill="#fff0b8"/><circle r="2.6" fill="#f8c3d2"/></g>
          <g transform="translate(296 58) scale(.8)"><circle r="4" cx="0" cy="-5" fill="#ffe0cc"/><circle r="4" cx="5" cy="0" fill="#ffe0cc"/><circle r="4" cx="0" cy="5" fill="#ffe0cc"/><circle r="4" cx="-5" cy="0" fill="#ffe0cc"/><circle r="2.6" fill="#fff"/></g>
        </g>
      </svg>
    </div>

    <p class="hint" id="hint" aria-live="polite">&nbsp;</p>

    <nav class="actions">
      <button class="pill" id="archiveBtn" type="button">
        <span class="pill-icon" aria-hidden="true">&#9993;</span>
        Tes lettres <span class="pill-count" id="archiveCount">0</span>
      </button>
    </nav>
  </main>

  <!-- Envelope delivery stage -->
  <div class="overlay stage" id="stage" hidden>
    <div class="stage-backdrop" id="stageBackdrop"></div>
    <div class="env-fly" id="envFly">
      <button class="envelope" id="envelope" type="button" aria-label="Open the letter">
        <span class="env-back"></span>
        <span class="env-paper"><span class="env-paper-lines"></span></span>
        <span class="env-front"></span>
        <span class="env-label" id="envLabel">Pour Becky</span>
        <span class="env-flap"><span class="env-flap-shape"></span></span>
        <span class="env-seal" aria-hidden="true">&#9829;</span>
      </button>
    </div>
    <p class="stage-hint" id="stageHint">Tap sur l'envelope pour l'ouvrire &#9825;</p>
  </div>

  <!-- Archive of received letters -->
  <div class="overlay archive" id="archive" hidden role="dialog" aria-modal="true" aria-labelledby="archiveTitle">
    <div class="archive-backdrop" data-close="archive"></div>
    <section class="archive-panel">
      <header class="archive-head">
        <h2 id="archiveTitle">Tes lettres</h2>
        <button class="icon-btn" type="button" data-close="archive" aria-label="Close">&#10005;</button>
      </header>
      <p class="archive-empty" id="archiveEmpty" hidden>Tu n'as pas encore reçu de lettres&hellip; Revient demain voir tu en as reçu &#9825;</p>
      <div class="archive-grid" id="archiveGrid"></div>
    </section>
  </div>

  <!-- Letter reader -->
  <div class="overlay reader" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="letterTitle">
    <button class="icon-btn reader-close" id="readerClose" type="button" aria-label="Close the letter">&#10005;</button>
    <div class="reader-scroll" id="readerScroll">
      <article class="letter" id="letter">
        <div class="bunting" id="bunting" hidden aria-hidden="true"></div>
        <section class="letter-page letter-page--text">
          <p class="letter-meta"><span id="letterNum"></span> &middot; <span id="letterDate"></span></p>
          <h2 class="letter-title" id="letterTitle"></h2>
          <div class="letter-body" id="letterBody"></div>
          <p class="letter-sign" id="letterSign"></p>
        </section>
        <section class="letter-page letter-page--photos" id="photosPage">
          <div class="photos" id="photos"></div>
        </section>
      </article>
    </div>
  </div>

  <!-- Photo viewer -->
  <div class="overlay lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo">
    <button class="icon-btn lb-close" type="button" data-close="lightbox" aria-label="Close">&#10005;</button>
    <button class="icon-btn lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous photo">&#8249;</button>
    <figure class="lb-figure">
      <img id="lbImg" alt="">
      <figcaption id="lbCap"></figcaption>
    </figure>
    <button class="icon-btn lb-nav lb-next" id="lbNext" type="button" aria-label="Next photo">&#8250;</button>
  </div>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <noscript><p class="noscript">This little mailbox needs JavaScript to deliver its letters &#9825;</p></noscript>

  <script src="letters.js"></script>
  <script src="app.js"></script>
</body>
</html>
